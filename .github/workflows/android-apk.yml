name: Build Android APK (Gradle)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      APP_ENV: preview
      EXPO_PUBLIC_API_BASE_URL: https://api.ttotem.ir
      TTOTEM_ANDROID_PACKAGE: ir.ttotem.app
      NODE_ENV: production
    steps:
      - name: Checkout dev source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the obsolete Android SDK package 'tools' included in action defaults.
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate Expo package versions
        run: npx expo install --check

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Assemble universal release APK (all CPU architectures)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Save universal APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ttotem-universal-release.apk

      - name: Assemble smaller ARM64 APK (modern Android phones)
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --rerun-tasks --no-daemon --stacktrace

      - name: Verify and stage optimized APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ttotem-arm64-release.apk
          echo "APK sizes:"
          ls -lh artifacts/
          echo "ARM64 APK native ABIs:"
          unzip -Z1 artifacts/ttotem-arm64-release.apk | grep '^lib/' | cut -d/ -f2 | sort -u
          if unzip -Z1 artifacts/ttotem-arm64-release.apk | grep -Eq '^lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "::error::Optimized APK still includes non-ARM64 libraries"
            exit 1
          fi
          echo "### Android APK sizes" >> "$GITHUB_STEP_SUMMARY"
          du -h artifacts/*.apk >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttotem-android-apk-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

# Download ttotem-arm64-release.apk for modern 64-bit ARM Android phones.\n# Use ttotem-universal-release.apk when device compatibility is uncertain.\n# This workflow is for internal installation/testing only. Expo's generated
# Android Gradle template may sign release builds with the default debug key.
# Never distribute this artifact as a Play Store production release.
