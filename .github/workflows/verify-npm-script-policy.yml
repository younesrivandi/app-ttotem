name: Verify npm install script policy
on:
  push:
    branches: [fix/expo57-install-script-policy]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Verify npm 12 script policy
        run: |
          npx --yes npm@12 --version
          npx --yes npm@12 ci
          npx --yes npm@12 install-scripts ls
      - name: Verify SDK compatibility and tests
        run: |
          npx expo install --check
          npm run verify
          npm run export:web
