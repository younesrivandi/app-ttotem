name: Expo 57 dependency audit
on:
  push:
    branches: [chore/expo57-dependency-audit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Audit dependency paths and remediation
        run: |
          npm audit --json > /tmp/ttotem-audit.json || true
          node <<'NODE'
          const a=require('/tmp/ttotem-audit.json');
          for(const [name,x] of Object.entries(a.vulnerabilities||{})){
            console.log(JSON.stringify({name,severity:x.severity,isDirect:x.isDirect,via:x.via.map(v=>typeof v==='string'?v:{name:v.name,title:v.title,range:v.range}),fixAvailable:x.fixAvailable,effects:x.effects}));
          }
          console.log('TOTALS',JSON.stringify(a.metadata?.vulnerabilities));
          NODE
          npm ls uuid eslint unrs-resolver --all || true
          npm ls expo react react-native --depth=0
      - name: Apply only in-range audit fixes
        run: |
          npm audit fix --package-lock-only --no-fund || true
          npm ci
          npm audit --json > /tmp/audit-after.json || true
          node -e "console.log('AFTER',JSON.stringify(require('/tmp/audit-after.json').metadata?.vulnerabilities))"
          git diff --stat
      - name: Verify application
        run: |
          npx expo install --check
          npm run verify
          npm run export:web
          npx expo-doctor@latest
      - name: Save tested lockfile-only fixes on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: safe lockfile security updates for Expo 57'
            git push origin HEAD:chore/expo57-dependency-audit
          fi
