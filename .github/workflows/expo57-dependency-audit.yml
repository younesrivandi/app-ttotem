name: Expo 57 dependency audit
on:
  push:
    branches: [chore/expo57-dependency-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Audit dependency paths and remediation
        run: |
          npm audit --json > /tmp/ttotem-audit.json || true
          node <<'NODE'
          const a=require('/tmp/ttotem-audit.json');
          for(const [name,x] of Object.entries(a.vulnerabilities||{})){
            console.log(JSON.stringify({name,severity:x.severity,isDirect:x.isDirect,via:x.via.map(v=>typeof v==='string'?v:{name:v.name,title:v.title,range:v.range}),fixAvailable:x.fixAvailable,effects:x.effects}));
          }
          console.log('TOTALS',JSON.stringify(a.metadata?.vulnerabilities));
          NODE
          npm ls uuid eslint unrs-resolver --all || true
          npm ls expo react react-native --depth=0
      - name: Verify application
        run: |
          npx expo install --check
          npm run verify
          npm run export:web
