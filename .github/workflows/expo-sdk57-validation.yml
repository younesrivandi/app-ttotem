name: Expo SDK 57 migration validation
on:
  push:
    branches: [chore/expo-sdk57-validation]
    paths:
      - '.github/workflows/expo-sdk57-validation.yml'
      - 'src/**'
      - 'tests/**'
      - 'app/**'
      - 'tsconfig.json'
      - 'tsconfig.engine-test.json'
      - 'eslint.config.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sdk57:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Upgrade SDK 54 to patched SDK 57 using Expo version map
        run: |
          npm pack 'expo@^57.0.9' --pack-destination /tmp --silent > /tmp/expo-tar-name
          mkdir -p /tmp/sdk57
          tar -xzf "/tmp/$(cat /tmp/expo-tar-name)" -C /tmp/sdk57
          node <<'NODE'
          const fs=require('node:fs'), cp=require('node:child_process');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const expo=JSON.parse(fs.readFileSync('/tmp/sdk57/package/package.json','utf8'));
          const native=JSON.parse(fs.readFileSync('/tmp/sdk57/package/bundledNativeModules.json','utf8'));
          pkg.dependencies.expo='^57.0.9';
          for(const [name,version] of Object.entries(native)) {
            if(pkg.dependencies[name]) pkg.dependencies[name]=version;
            if(pkg.devDependencies[name]) pkg.devDependencies[name]=version;
          }
          for(const peer of ['expo-asset','expo-constants','expo-linking']) pkg.dependencies[peer]=native[peer];
          pkg.dependencies.react='19.2.3';
          pkg.dependencies['react-dom']='19.2.3';
          pkg.dependencies['react-native']='0.86.0';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          delete app.expo.newArchEnabled;
          delete app.expo.android.edgeToEdgeEnabled;
          delete app.expo.androidNavigationBar;
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          NODE
          rm -rf node_modules package-lock.json
          npm install
          npx expo install --fix --npm
      - name: Verify dependencies and configuration
        run: |
          npx expo install --check
          npx expo-doctor@latest
      - name: Test existing application behavior
        run: npm run verify
      - name: Export production web bundle
        run: npm run export:web
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.ttotem.ir
      - name: Verify reproducible lockfile
        run: npm ci
      - name: Persist only fully validated migration in isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json app.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: migrate dependency matrix to validated Expo SDK 57'
            git push origin HEAD:chore/expo-sdk57-validation
          fi
